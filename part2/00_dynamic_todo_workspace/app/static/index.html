<!doctype html>
<html lang="en" data-theme="dark" data-accent="indigo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenith Task Workspace</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" aria-label="Navigation">
      <div class="brand">
        <span class="brand-mark">✦</span>
        <span class="brand-name label">Zenith Task</span>
        <button id="sidebar-toggle" class="icon-btn" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse / expand sidebar">
          <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>

      <nav id="smart-nav" class="nav-group"></nav>

      <div class="nav-section">
        <div class="nav-heading"><span class="label">Categories</span>
          <button id="add-category" class="icon-btn" aria-label="Add category" title="Add category">+</button>
        </div>
        <form id="category-form" class="inline-form" hidden>
          <input class="input compact" maxlength="60" placeholder="Category name" aria-label="New category name">
        </form>
        <nav id="category-nav" class="nav-group"></nav>
      </div>

      <div class="nav-section tags-section">
        <div class="nav-heading"><span class="label">Tags</span>
          <button id="tags-button" class="icon-btn" aria-label="Manage tags" title="Manage tags">⋯</button>
        </div>
        <div id="tag-nav" class="tag-row"></div>
      </div>

      <nav id="lifecycle-nav" class="nav-group nav-section"></nav>

      <div class="sidebar-footer nav-group">
        <button id="activity-button" class="nav-item" title="Activity log">
          <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          <span class="label">Activity log</span>
        </button>
        <button id="shortcuts-button" class="nav-item" title="Keyboard shortcuts (?)">
          <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
          <span class="label">Shortcuts</span>
        </button>
        <button id="mute-toggle" class="nav-item" title="Toggle sound"></button>
        <button id="theme-toggle" class="nav-item" title="Toggle theme"></button>
        <div id="accent-picker" class="accent-picker label"></div>
        <div class="label"><span id="sync-status" class="sync-status offline">Connecting…</span></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div id="view-switcher" class="view-switcher" role="toolbar" aria-label="Views"></div>
        <div class="topbar-right">
          <label class="search">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input id="search-input" type="search" placeholder="Search  /" aria-label="Search tasks">
          </label>
          <select id="sort-select" class="input compact" aria-label="Sort tasks"></select>
          <button id="palette-button" class="btn" title="Command palette (Ctrl/⌘ K)"><kbd>Ctrl K</kbd></button>
          <button id="pomodoro-button" class="btn primary" title="Focus timer">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>
            <span>Focus</span>
          </button>
        </div>
      </header>

      <section class="capture">
        <form id="capture-form" class="capture-form" autocomplete="off">
          <input id="capture-input" class="capture-input" maxlength="500" aria-label="Quick capture"
                 placeholder="Add a task… e.g. Review PR !high #backend ~30m @tomorrow">
          <select id="capture-category" class="input compact" aria-label="Category for new task"></select>
          <button id="capture-submit" class="btn primary" type="submit" disabled>Add</button>
        </form>
        <div id="capture-chips" class="capture-chips" aria-live="polite"></div>
      </section>

      <div id="scope-banner" class="scope-banner" hidden></div>
      <section id="view-root" class="view" aria-live="polite"></section>
    </main>
  </div>

  <div id="bulk-bar" class="bulk-bar" role="toolbar" aria-label="Bulk actions" hidden></div>
  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
